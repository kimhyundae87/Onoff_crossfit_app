'use strict';const K='onoff-demo-v1',today=new Date(),pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,todayKey=fmt(today),$=s=>document.querySelector(s);let state={};try{state=JSON.parse(localStorage.getItem(K))||{}}catch(e){}state={name:'ONOFF 회원',gender:'male',firstDate:'2023-03-15',goal:3,visits:{},logs:{},prs:{},...state};for(const k of ['visits','logs','prs','prHistory','publishedClasses','classDrafts'])state[k]=state[k]||{};let firebaseUser=null, firebaseRole='member', firebaseApproved=false;let page='home',cls='WOD',month=new Date(today.getFullYear(),today.getMonth(),1),adminDate=todayKey,adminClass='WOD',adminMode=false;function save(){localStorage.setItem(K,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>el.style.display='none',2600)}function isAppDay(d){return d.getDay()===0||['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'].includes(fmt(d).slice(5))}function avatar(){return state.gender==='female'?'🏋🏻‍♀️':'🏋🏻‍♂️'}function rank(){const f=new Date(state.firstDate+'T12:00:00');let y=today.getFullYear()-f.getFullYear();if(today.getMonth()<f.getMonth()||(today.getMonth()===f.getMonth()&&today.getDate()<f.getDate()))y--;return Math.max(0,y)+' YEARS'}function render(){const tabs=adminMode?[['admin','⚙️','관리자'],['home','⌂','회원 화면']]:[['home','⌂','홈'],['class','🏋️','오늘 수업'],['manage','▥','운동 관리'],['share','♧','기록 공유']];$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="tab ${page===p?'active':''}" onclick="showPage('${p}')"><span class="emoji">${i}</span>${t}</button>`).join('');$('#content').innerHTML=({home,checkin,road,class:classes,manage,share,profile,record:recordPage,admin:adminPage,members:membersPage}[page]||home)()}function showPage(p){if((p==='admin getFullYear(),month.getMonth()+1,0).getDate();let a=[];for(let i=0;i<first;i++)a.push('<div class="day empty"></div>');for(let i=1;i<=last;i++){const d=new Date(month.getFullYear(),month.getMonth(),i),k=fmt(d),v=state.visits[k];a.push(`<button class="day ${k===todayKey?'today':''} ${d.getDay()===0?'sunday':''}" onclick="dayDetail('${k}')">${i}${v?`<span class="calendar-icon">${v==='gym'?'🔥':'😊'}</span>`:''}</button>`)}return a.join('')}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function dayDetail(k){toast(`${k} · ${state.visits[k]==='gym'?'방문 출석':state.visits[k]==='app'?'앱 참여':'출석 기록 없음'}`)}function road(){return `<h1 class="heading">월간 출석 로드맵</h1><p class="sub">하루 한 칸씩 운동 습관을 기록합니다.</p><div class="card"><span class="badge">🏅 ${rank()}</span><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${month.getFullYear()}년 ${month.getMonth()+1}월</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="days">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${calendarCells()}</div></div><button class="btn" onclick="showPage('checkin')">오늘 출석하러 가기</button>`}function checkin(){const app=isAppDay(today),v=state.visits[todayKey];return `<h1 class="heading">오늘의 출석</h1><p class="sub">${todayKey}</p><div class="card" style="text-align:center;padding:25px 18px"><div style="font-size:58px;margin:15px">${app?'😊':'📍'}</div><h2>${app?'앱 참여 체크인':'GPS 출석 체크'}</h2><p class="info">${app?'일요일·고정 공휴일 앱 참여 체험입니다.':'방문 출석 시뮬레이션입니다. 실제 GPS를 확인하지 않습니다.'}</p><button class="btn" ${v?'disabled':''} onclick="checkToday()">${v?'오늘 출석 완료':'오늘 출석 체험하기'}</button></div>`}function checkToday(){if(state.visits[todayKey])return;state.visits[todayKey]=isAppDay(today)?'app':'gym';save();render();toast('이 기기에 체험 출석이 저장되었습니다.')}

function findSectionLift(text){const t=normPr(text);return [...prMovements].sort((a,b)=>b.length-a.length).find(n=>t.includes(normPr(n)))||null}
function percentages(c){const lift=findSectionLift(getClass(c).s1);if(!lift)return '';const val=Number(state.prs[lift]);return val>0?`<div class="percent-row">${[50,60,70,80,90].map(p=>`<div class="percent">${p}%<b>${+(val*p/100).toFixed(1)} lb</b></div>`).join('')}</div>`:''}
function classes(){const w=cls==='WOD',d=getClass(cls);return `<h1 class="heading">오늘의 수업</h1><p class="sub">WOD / BT CLASS</p><div class="switch"><button class="wod ${w?'active':''}" onclick="cls='WOD';render()">WOD CLASS</button><button class="bt ${!w?'active':''}" onclick="cls='BT';render()">BT CLASS</button></div><div class="card class-card"><div class="section-title" style="color:${w?'var(--wod)':'var(--bt)'}">SECTION 1</div><div class="class-body">${esc(d.s1)}</div>${percentages(cls)}${videos(d.s1)}<hr class="class-divider"><div class="section-title" style="color:${w?'var(--wod)':'var(--bt)'}">SECTION 2</div><div class="class-body">${esc(d.s2)}</div>${videos(d.s2)}<button class="btn class-record" onclick="showPage('record')">오늘의 기록 입력</button></div><p class="preview-warning">체험판: 수업은 이 브라우저의 게시 데이터 또는 예시입니다. 서버 동기화 전입니다.</p>`}function recordPage(){const v1=state.logs[todayKey+'-'+cls+'-1']||'',v2=state.logs[todayKey+'-'+cls+'-2']||'';return `<h1 class="heading">오늘의 기록 입력</h1><p class="sub">${cls} CLASS · ${todayKey}</p><div class="card"><h3>SECTION 1</h3><p class="small">중량(lbs) / 횟수 / 세트</p><textarea id="s1" placeholder="예: 185 lbs × 5회 × 5세트">${esc(v1)}</textarea><hr class="class-divider"><h3>SECTION 2</h3><p class="small">라운드 / 반복 횟수 / RX 등</p><textarea id="s2" placeholder="예: 5 Rounds + 8 Reps · RX">${esc(v2)}</textarea><button class="btn" style="margin-top:15px" onclick="saveLog()">기록 저장</button><button class="btn alt" style="margin-top:9px" onclick="showPage('class')">오늘의 수업으로 돌아가기</button></div>`}function saveLog(){state.logs[todayKey+'-'+cls+'-1']=$('#s1').value;state.logs[todayKey+'-'+cls+'-2']=$('#s2').value;save();showPage('class');toast('이 기기에 운동 기록을 저장했습니다.')}function manage(){const entries=Object.entries(state.logs).filter(([,v])=>String(v).trim()).sort((a,b)=>b[0].localeCompare(a[0]));const grouped=new Map();for(const [k,v] of entries){const m=k.match(/^(\d{4}-\d{2}-\d{2})-(WOD|BT)-([12])$/);if(!m){grouped.set(k,{title:k,sections:[{label:'기록',value:v}]});continue}const id=m[1]+'-'+m[2];if(!grouped.has(id))grouped.set(id,{title:m[1]+' · '+m[2],sections:[]});grouped.get(id).sections.push({label:'SECTION '+m[3],value:v})}return `<h1 class="heading">운동 관리</h1><p class="sub">나의 운동 기록과 PR</p><div class="card"><h3>운동 기록</h3>${grouped.size?[...grouped.values()].map(g=>`<div class="score" style="margin:8px 0"><b style="color:${g.title.endsWith(' · WOD')?'var(--wod)':g.title.endsWith(' · BT')?'var(--bt)':'inherit'}">${esc(g.title)}</b>${g.sections.sort((a,b)=>a.label.localeCompare(b.label)).map((s,i)=>`<div style="margin-top:12px"><div class="small" style="margin-bottom:5px">${esc(s.label)}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.value)}</div></div>`).join('')}</div>`).join(''):'<p class="info">아직 작성된 기록이 없습니다.</p>'}</div><div class="card"><h3>나의 PR (lbs)</h3><p class="small">운동 종목을 선택하고 현재 PR을 등록하거나 갱신하세요.</p><div class="stack"><select id="prName" style="width:100%;padding:14px;border-radius:12px;background:#101d21;color:#f2f5f2;border:1px solid #354649"><option value="">운동 종목 선택</option>${prMovements.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><input id="prValue" type="number" min="0.1" step="any" placeholder="중량 (lbs)"><button class="btn alt" onclick="savePr()">PR 저장 / 갱신</button></div>${Object.entries(state.prs).sort(([a],[b])=>a.localeCompare(b)).map(([n,v])=>`<div style="padding:14px 0;border-bottom:1px solid #354649"><div class="row" style="gap:8px;flex-wrap:wrap"><b>${esc(n)}</b><b>${esc(v)} lbs</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn alt" style="width:auto;padding:9px 14px" onclick="editPr('${esc(n)}')">수정</button><button class="btn alt" style="width:auto;padding:9px 14px" onclick="togglePrHistory('${esc(n)}')">성장 기록 (${(state.prHistory[n]||[]).length})</button><button class="btn alt" style="width:auto;padding:9px 14px" onclick="deletePr('${esc(n)}')">삭제</button></div><div id="prhist-${esc(n)}" style="display:none;margin-top:10px">${(state.prHistory[n]||[]).slice().reverse().map(h=>`<div class="small" style="padding:5px 0">${esc(h.date)} · ${esc(h.value)} lbs</div>`).join('')||'<span class="small">아직 이전 기록이 없습니다.</span>'}</div></div>`).join('')}</div>`}
function savePr(){const n=$('#prName').value,v=Number($('#prValue').value);if(!n||!Number.isFinite(v)||v<=0)return toast('종목과 올바른 중량을 입력해 주세요');const old=Number(state.prs[n]);if(old===v)return toast('현재 PR과 같은 중량입니다.');if(old>0){state.prHistory[n]=state.prHistory[n]||[];state.prHistory[n].push({date:fmt(new Date()),value:old})}state.prs[n]=v;save();render();toast(old?'PR이 갱신되었습니다. 이전 기록을 보관했습니다.':'PR이 등록되었습니다.')}
function editPr(n){const select=$('#prName'),value=$('#prValue');select.value=n;value.value=state.prs[n];value.focus();toast('중량을 수정한 뒤 PR 저장 / 갱신을 눌러주세요.')}
function togglePrHistory(n){const el=document.getElementById('prhist-'+n);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function deletePr(n){if(!confirm(n+' PR과 성장 기록을 모두 삭제할까요?'))return;delete state.prs[n];delete state.prHistory[n];save();render();toast('PR과 성장 기록을 삭제했습니다.')}
function share(){return `<h1 class="heading">기록 공유</h1><p class="sub">회원 기록 공유 체험</p><div class="card"><div class="row"><span style="font-size:32px">${avatar()}</span><div><b>${esc(state.name)}</b><br><span class="badge">🏅 ${rank()}</span></div></div></div><div class="card"><h3>회원 기록 예시</h3>${[['김OO','3 YEARS','Back Squat · 225 lb'],['이OO','2 YEARS','Fran · 6:40'],['박OO','1 YEAR','첫 Pull-up 달성']].map(([n,r,t])=>`<div class="score" style="margin:8px 0"><b>${n}</b> <span class="badge">🏅 ${r}</span><div class="small">${t}</div></div>`).join('')}<p class="small">가상 데이터입니다. 실제 공유는 서버 연동 이후 가능합니다.</p></div>`}function profile(){return `<h1 class="heading">MY 프로필</h1><p class="sub">프로필 설정 체험</p><div class="card" style="text-align:center"><div style="font-size:72px">${avatar()}</div><h2>${esc(state.name)}</h2><span class="badge">🏅 ONOFF ${rank()}</span></div><div class="card"><h3>기본 정보</h3><div class="stack"><label class="small">이름</label><input id="memberName" value="${esc(state.name)}"><label class="small">캐릭터 선택</label><div class="choice"><button class="${state.gender==='male'?'selected':''}" onclick="setGender('male')">🏋🏻‍♂️ 남성</button><button class="${state.gender==='female'?'selected':''}" onclick="setGender('female')">🏋🏻‍♀️ 여성</button></div><label class="small">최초 등록일</label><input id="firstDate" type="date" value="${esc(state.firstDate)}"><label class="small">주간 출석 목표</label><select id="goal">${[2,3,4,5].map(n=>`<option value="${n}" ${state.goal==n?'selected':''}>주 ${n}회</option>`).join('')}</select><button class="btn" onclick="saveProfile()">프로필 저장</button></div></div>${firebaseRole==='admin'?'<div class="card"><h3>관리자 수업 게시</h3><p class="info">현재 수업 게시 기능은 이 기기에만 저장됩니다.</p><button class="btn alt" onclick="enterAdmin()">수업 관리 열기</button></div>':''}<div class="card"><h3>계정</h3><p class="info">${esc(firebaseUser?.email||'')} · ${firebaseRole==='admin'?'관리자':'회원'}</p><button class="btn alt" onclick="onoffLogout()">로그아웃</button></div><div class="card"><h3>체험판 안내</h3><p class="info">실제 로그인, 회원별 서버 저장, GPS 검증, 관리자 권한, 데이터 동기화는 구현되지 않았습니다.</p><button class="btn outline" onclick="resetDemo()">체험 데이터 초기화</button></div>`}function setGender(g){state.gender=g;save();render()}function saveProfile(){state.name=$('#memberName').value.trim()||'ONOFF 회원';state.firstDate=$('#firstDate').value||'2023-03-15';state.goal=Number($('#goal').value);save();render();toast('프로필을 저장했습니다.')}function resetDemo(){if(confirm('이 브라우저의 체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(K);location.reload()}}function enterAdmin(){if(firebaseRole!=='admin')return toast('관리자만 이용할 수 있습니다.');adminMode=true;page='admin';render();window.scrollTo(0,0)}function adminKey(){return adminDate+'-'+adminClass}function adminData(){return state.classDrafts[adminKey()]||state.publishedClasses[adminKey()]||demoClasses[adminClass]}function adminPage(){const d=adminData();return `<h1 class="heading">관리자 · 수업 관리</h1><p class="sub">회원 화면과 분리된 수업 게시 화면</p><div class="admin-banner">⚠ 관리자 인증은 적용되었습니다. 수업 게시 데이터는 아직 이 기기에만 저장됩니다.</div><div class="card admin-card"><h3>수업 작성</h3><div class="admin-grid"><label>수업 날짜</label><input id="adminDate" type="date" value="${esc(adminDate)}" onchange="changeAdminSelection()"><label>수업 구분</label><select id="adminClass" onchange="changeAdminSelection()"><option value="WOD" ${adminClass==='WOD'?'selected':''}>WOD CLASS</option><option value="BT" ${adminClass==='BT'?'selected':''}>BT CLASS</option></select><label>SECTION 1 · 자유 입력</label><textarea id="adminS1" rows="5">${esc(d.s1)}</textarea><label>SECTION 2 · 자유 입력</label><textarea id="adminS2" rows="6">${esc(d.s2)}</textarea><button class="btn alt" onclick="saveDraft()">임시 저장</button><button class="btn" onclick="publishClass()">수업 게시 (이 기기에서만)</button></div><p class="preview-warning">수업 내용을 수정해도 회원 화면의 디자인 CSS는 변경되지 않습니다.</p></div><div class="card admin-card"><h3>공지사항</h3><textarea id="adminNotice" rows="4">${esc(state.noticeDraft??state.noticePublished??'')}</textarea><button class="btn alt" style="margin-top:10px" onclick="saveNoticeDraft()">공지 임시 저장</button><button class="btn" style="margin-top:9px" onclick="publishNotice()">공지 게시 (이 기기에서만)</button></div><button class="btn outline" onclick="adminMode=false;showPage('home')">회원 화면으로 돌아가기</button>`}function changeAdminSelection(){adminDate=$('#adminDate').value||todayKey;adminClass=$('#adminClass').value;render()}function draftFromForm(){return{s1:$('#adminS1').value,s2:$('#adminS2').value}}function saveDraft(){state.classDrafts[adminKey()]=draftFromForm();save();toast('이 기기에 임시 저장했습니다.')}function publishClass(){state.publishedClasses[adminKey()]=draftFromForm();delete state.classDrafts[adminKey()];save();toast('이 기기에 게시했습니다.')}function saveNoticeDraft(){state.noticeDraft=$('#adminNotice').value;save();toast('공지 임시 저장 완료')}function publishNotice(){state.noticePublished=$('#adminNotice').value;delete state.noticeDraft;save();toast('이 기기에 공지를 게시했습니다.')}function membersPage(){if(firebaseRole!=='admin')return '<p>접근 권한이 없습니다.</p>';return `<h1 class="heading">회원 관리</h1><p class="sub">관리자 전용 · Firebase 가입 승인</p><div class="card members-card"><h3>승인 대기 회원</h3><div id="pendingMembers"><p class="info">회원 목록을 불러오는 중...</p></div><button class="btn alt" onclick="loadPendingMembers()">목록 새로고침</button></div><button class="btn outline" onclick="showPage('home')">홈으로 돌아가기</button>`}
render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs,updateDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={apiKey:'AIzaSyAJwYROKhqzbodxgamNdbQwW7m1-50oc9I',authDomain:'onoff-crossfit.firebaseapp.com',projectId:'onoff-crossfit',storageBucket:'onoff-crossfit.firebasestorage.app',messagingSenderId:'125418217095',appId:'1:125418217095:web:15ef61ae5ccfa4d14aa222',measurementId:'G-FGXM0KV6P3'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
let mode='login',busy=false;
const el=id=>document.getElementById(id),message=t=>el('authMessage').textContent=t;
function authMode(m){mode=m;el('authTitle').textContent=m==='signup'?'회원가입':m==='reset'?'비밀번호 찾기':'로그인';el('authHelp').textContent=m==='signup'?'가입 후 관리자의 승인이 필요합니다.':m==='reset'?'비밀번호 재설정 이메일을 보내드립니다.':'';el('nameWrap').hidden=m!=='signup';el('confirmWrap').hidden=m!=='signup';el('passwordWrap').hidden=m!=='signup';el('authConfirm').required=m==='signup';el('modalAction').textContent=m==='signup'?'가입 신청':'재설정 메일 보내기';if(m==='login')el('authModal').classList.remove('open');message('')}
el('authLoginLink').onclick=()=>authMode('login');el('authSignupLink').onclick=()=>{authMode('signup');el('modalEmail').value=el('authEmail').value;el('authModal').classList.add('open')};el('authResetLink').onclick=()=>{authMode('reset');el('modalEmail').value=el('authEmail').value;el('authModal').classList.add('open')};el('modalClose').onclick=()=>authMode('login');el('eye').onclick=()=>{const p=el('authPassword');p.type=p.type==='password'?'text':'password'};
function gate(show){el('authGate').hidden=!show;el('onoffApp').style.display=show?'none':''}
function friendly(e){const c=e?.code||'';return ({'auth/email-already-in-use':'이미 가입된 이메일입니다.','auth/invalid-credential':'이메일 또는 비밀번호를 확인해 주세요.','auth/weak-password':'비밀번호는 6자 이상 입력해 주세요.','auth/invalid-email':'이메일 주소를 확인해 주세요.','permission-denied':'Firestore 보안 규칙을 확인해 주세요.'})[c]||e?.message||'오류가 발생했습니다.'}
el('authForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;el('authSubmit').disabled=true;message('로그인 처리 중...');try{await signInWithEmailAndPassword(auth,el('authEmail').value.trim(),el('authPassword').value)}catch(err){message(friendly(err))}finally{busy=false;el('authSubmit').disabled=false}};
el('modalAction').onclick=async()=>{if(busy)return;const email=el('modalEmail').value.trim();if(!el('modalEmail').checkValidity()){el('modalEmail').reportValidity();return}busy=true;el('modalAction').disabled=true;try{if(mode==='reset'){await sendPasswordResetEmail(auth,email);authMode('login');message('비밀번호 재설정 메일을 발송했습니다.')}else if(mode==='signup'){const name=el('authName').value.trim(),pw=el('modalPassword').value;if(!name)throw Error('이름을 입력해 주세요.');if(pw.length<6)throw Error('비밀번호는 6자 이상 입력해 주세요.');if(pw!==el('authConfirm').value)throw Error('비밀번호가 일치하지 않습니다.');const result=await createUserWithEmailAndPassword(auth,email,pw);await setDoc(doc(db,'users',result.user.uid),{name,email,role:'member',approved:false,createdAt:new Date().toISOString()});await signOut(auth);authMode('login');message('가입 신청 완료 · 관리자 승인 후 로그인할 수 있습니다.')}}catch(err){alert(friendly(err))}finally{busy=false;el('modalAction').disabled=false}};
onAuthStateChanged(auth,async user=>{gate(true);firebaseUser=null;firebaseRole='member';firebaseApproved=false;if(!user){authMode('login');return}try{const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()){message('계정 정보가 없습니다. 관리자에게 문의해 주세요.');return}const data=snap.data();firebaseUser=user;firebaseRole=data.role==='admin'?'admin':'member';firebaseApproved=data.approved===true;if(!firebaseApproved){message('관리자 승인 대기 중입니다. 승인 후 이용할 수 있습니다.');return}state.name=data.name||state.name;page='home';adminMode=false;render();gate(false)}catch(e){message('계정 확인 실패: '+friendly(e))}});
window.onoffLogout=()=>signOut(auth);
window.loadPendingMembers=async()=>{if(firebaseRole!=='admin'||!firebaseUser)return;const box=el('pendingMembers');if(!box)return;box.textContent='불러오는 중...';try{const result=await getDocs(query(collection(db,'users'),where('approved','==',false)));box.replaceChildren();if(result.empty){box.textContent='승인 대기 회원이 없습니다.';return}result.forEach(snap=>{const u=snap.data(),item=document.createElement('div');item.className='member-row';const title=document.createElement('b');title.textContent=u.name||'이름 미등록';const info=document.createElement('p');info.className='small';info.textContent=u.email||snap.id;const actions=document.createElement('div');actions.className='member-actions';const yes=document.createElement('button');yes.className='btn';yes.textContent='승인';yes.onclick=()=>changeApproval(snap.id,true);const no=document.createElement('button');no.className='btn alt';no.textContent='거절';no.onclick=()=>changeApproval(snap.id,false);actions.append(yes,no);item.append(title,info,actions);box.append(item)})}catch(e){box.textContent='목록 조회 실패: '+friendly(e)}};
async function changeApproval(uid,approve){if(firebaseRole!=='admin')return;if(!approve&&!confirm('가입 신청을 거절할까요?'))return;try{await updateDoc(doc(db,'users',uid),{approved:approve,status:approve?'approved':'rejected'});toast(approve?'회원 승인 완료':'가입 신청 거절 처리');loadPendingMembers()}catch(e){toast('처리 실패: '+friendly(e))}}
const originalShow=window.showPage;window.showPage=function(p){originalShow(p);if(p==='members'&&firebaseRole==='admin')loadPendingMembers()};
</script></body></html>
