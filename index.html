const today=new Date(), K='onoff-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(K))||{}}catch{state={}};state={name:'ONOFF 회원',gender:'male',firstDate:'2023-03-15',goal:3,visits:{},logs:{},prs:{},...state};let page='home',month=new Date(today.getFullYear(),today.getMonth(),1),cls='WOD',selectedDay=null;const $=s=>document.querySelector(s);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,todayKey=fmt(today);function save(){localStorage.setItem(K,JSON.stringify(state))}function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isHoliday(d){const k=fmt(d);const fixed=['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];return fixed.includes(k.slice(5))}function isAppDay(d){return d.getDay()===0||isHoliday(d)}function visits(){return Object.values(state.visits).filter(Boolean)}function count(type){return Object.values(state.visits).filter(v=>v===type).length}function avatar(){return state.gender==='female'?'🏋🏻‍♀️':'🏋🏻‍♂️'}function rank(){const yrs=Math.max(0,today.getFullYear()-new Date(state.firstDate+'T12:00:00').getFullYear()-(today.getMonth()<new Date(state.firstDate+'T12:00:00').getMonth()||today.getMonth()===new Date(state.firstDate+'T12:00:00').getMonth()&&today.getDate()<new Date(state.firstDate+'T12:00:00').getDate()?1:0));return yrs+' YEARS'}function render(){let tabs=[['home','⌂','홈'],['class','🏋️','오늘 수업'],['manage','▥','운동 관리'],['share','♧','기록 공유']];$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="tab ${page===p?'active':''}" onclick="showPage('${p}')"><span class="emoji">${i}</span>${t}</button>`).join('');let out=page==='home'?home():page==='road'?road():page==='checkin'?checkin():page==='class'?classes():page==='manage'?manage():page==='share'?share():page==='record'?recordPage():profile();$('#content').innerHTML=out}function showPage(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function home(){const key=fmt(month).slice(0,7),m=Object.entries(state.visits).filter(([k])=>k.startsWith(key)),gym=m.filter(([,v])=>v==='gym').length,app=m.filter(([,v])=>v==='app').length,goal=Number(state.goal||3)*4,done=gym+app;return `<div class="card"><h3>📢 공지사항</h3><div class="notice">ONOFF 공지사항<br><span class="small">관리자가 등록한 공지가 이곳에 표시됩니다. 현재는 디자인 체험판입니다.</span></div></div><div class="card"><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${month.getFullYear()}년 ${month.getMonth()+1}월</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="days">${['일','월','화','수','목','금','토'].map(t=>`<div class="weekday">${t}</div>`).join('')}${calendarCells()}</div><div class="row" style="margin-top:14px;justify-content:center;flex-wrap:wrap"><span class="small">🔥 방문 출석</span><span class="small">😊 앱 참여</span><span class="small">▢ 오늘</span></div><button class="btn alt" style="margin-top:15px" onclick="showPage('checkin')">오늘 출석 체험하기</button></div><div class="card"><h3>나의 출석 현황</h3><div class="stats"><div class="stat"><span class="small">방문 출석</span><strong style="color:#ff936b">${gym}회</strong></div><div class="stat"><span class="small">앱 참여</span><strong style="color:#ffd45e">${app}회</strong></div><div class="stat"><span class="small">월간 달성</span><strong>${done}일</strong></div></div><div class="progress" style="margin-top:15px"><span style="width:${Math.min(100,done/Math.max(1,goal)*100)}%"></span></div><p class="small">월간 목표 ${done} / ${goal}일 (주간 목표 × 4주 기준)</p></div>`}function calendarCells(roadMode=false){let first=month.getDay(),last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),a=[];for(let i=0;i<first;i++)a.push(`<div class="${roadMode?'roadstep':'day'} empty"></div>`);for(let i=1;i<=last;i++){let d=new Date(month.getFullYear(),month.getMonth(),i),k=fmt(d),type=state.visits[k],same=k===todayKey,cl=`${roadMode?'roadstep':'day'} ${type==='gym'?'done':type==='app'?'appcheck':''} ${same?'today':''} ${d.getDay()===0?'sunday':''}`;a.push(`<button class="${cl}" onclick="dayDetail('${k}')" aria-label="${k} 출석 ${type?'완료':'미기록'}">${roadMode&&same?`<span class="avatar">${avatar()}</span>`:`<span>${i}</span>${type?`<span class="calendar-icon">${type==='gym'?'🔥':'😊'}</span>`:''}`}</button>`)}return a.join('')}function road(){let ym=`${month.getFullYear()}년 ${month.getMonth()+1}월`,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),done=Object.keys(state.visits).filter(k=>k.startsWith(fmt(month).slice(0,7))).length;return `<h1 class="heading">월간 출석 로드맵</h1><p class="sub">하루 한 칸씩, 나의 운동 습관을 기록합니다.</p><div class="card"><div class="row"><span class="badge">🏅 ${rank()}</span><span class="pill">${avatar()} ${esc(state.name)}</span></div><h2>${done} <span class="small">/ ${days}일</span></h2><div class="progress"><span style="width:${done/days*100}%"></span></div><p class="small">GPS 출석 ${Object.entries(state.visits).filter(([k,v])=>k.startsWith(fmt(month).slice(0,7))&&v==='gym').length}일 · 앱 체크인 ${Object.entries(state.visits).filter(([k,v])=>k.startsWith(fmt(month).slice(0,7))&&v==='app').length}일</p></div><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${ym}</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="road"><div class="days" style="margin-bottom:9px">${['일','월','화','수','목','금','토'].map(t=>`<div class="weekday">${t}</div>`).join('')}</div><div class="roadgrid">${calendarCells(true)}</div></div><div class="card"><div class="row"><span class="inline"><span style="color:var(--mint)">●</span><span class="small">GPS 출석</span></span><span class="inline"><span style="color:#82b5ff">●</span><span class="small">앱 체크인</span></span><span class="inline"><span style="color:#d3bd76">◉</span><span class="small">오늘</span></span></div><p class="info">일요일과 고정 공휴일은 앱 체크인, 나머지 날은 GPS 출석을 체험합니다. 음력·대체·임시 공휴일 자동 판정은 실제 개발 시 공식 달력 연동이 필요합니다.</p><button class="btn" onclick="showPage('checkin')">오늘 출석하러 가기</button></div>`}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function dayDetail(k){selectedDay=k;const d=new Date(k+'T12:00:00'),t=state.visits[k];toast(`${k} · ${t==='gym'?'GPS 방문 출석':t==='app'?'앱 체크인':'출석 기록 없음'}`)}function checkin(){const app=isAppDay(today),v=state.visits[todayKey];return `<h1 class="heading">오늘의 출석</h1><p class="sub">${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 · ${['일','월','화','수','목','금','토'][today.getDay()]}요일</p><div class="card" style="text-align:center;padding:25px 18px"><div style="font-size:58px;margin:15px">${app?'☕':'📍'}</div><h2>${app?'오늘도 ONOFF!':'GPS 출석 체크'}</h2><p class="info">${app?'일요일·공휴일에는 앱에서 버튼을 눌러 로드맵을 채웁니다.':'평일·토요일에는 체육관에 방문하여 GPS로 출석합니다.'}</p><div class="score" style="margin:17px 0"><span class="pill">${v?'✓ 오늘 체크 완료':app?'앱 체크인 가능':'GPS 방문 출석'}</span></div><button class="btn" ${v?'disabled':''} onclick="checkToday()">${v?'오늘 출석 완료':app?'오늘도 ONOFF · 체크인':'GPS 출석 시뮬레이션'}</button><p class="small">${app?'앱 체크인은 실제 운동 방문으로 계산하지 않습니다.':'이 체험판에서는 GPS를 확인하지 않습니다. 버튼으로 가상 출석만 저장됩니다.'}</p></div><div class="card"><h3>이번 달 출석 현황</h3><button class="btn alt" onclick="month=new Date(today.getFullYear(),today.getMonth(),1);showPage('road')">로드맵 확인 →</button></div>`}function checkToday(){if(state.visits[todayKey])return;state.visits[todayKey]=isAppDay(today)?'app':'gym';save();render();toast('체험 출석이 기록되었습니다!')}const exerciseLibrary=[{id:'back-squat',name:'Back Squat',aliases:['백 스쿼트','Back Squat'],url:''},{id:'dumbbell-snatch',name:'Dumbbell Snatch',aliases:['덤벨 스내치','DB Snatch'],url:''},{id:'pull-up',name:'Pull-up',aliases:['풀업','Pull Up'],url:''},{id:'toes-to-bar',name:'Toes to Bar',aliases:['TTB','토즈투바'],url:''},{id:'thruster',name:'Thruster',aliases:['쓰러스터','Thrusters'],url:''},{id:'strict-press',name:'Strict Press',aliases:['숄더 프레스'],url:''},{id:'dumbbell-press',name:'Dumbbell Press',aliases:['덤벨 프레스'],url:''},{id:'ring-row',name:'Ring Row',aliases:['링 로우'],url:''},{id:'wall-ball',name:'Wall Ball',aliases:['월볼'],url:''}];let recordSection=1,videoOpen='',adminVideo=false;function library(){return exerciseLibrary.map(x=>({...x,url:(state.videoUrls||{})[x.id]||x.url}))}function selectedMoves(){let text=state.classText?.[cls+'-1']+' '+state.classText?.[cls+'-2'];if(!state.classText||!state.classText[cls+'-2'])text=cls==='WOD'?'Back Squat, Dumbbell Snatch, Pull-up':'Strict Press, Dumbbell Press, Ring Row';return library().filter(x=>[x.name,...x.aliases].some(a=>text.toLowerCase().includes(a.toLowerCase())))}function videoCard(x){let valid=videoId(x.url);return `<div><button class="video-card" onclick="videoOpen=videoOpen==='${x.id}'?'':'${x.id}';render()"><div class="video-thumb">▶</div><div style="min-width:0"><div class="video-name">${esc(x.name)}</div><div class="video-desc">ONOFF 운동 동작 가이드</div><div class="video-link">${valid?'영상 미리보기 ›':'영상 준비 중 ›'}</div></div></button>${videoOpen===x.id?`<div class="video-player">${valid?`<iframe src="https://www.youtube-nocookie.com/embed/${valid}" title="${esc(x.name)}" allowfullscreen loading="lazy"></iframe>`:'<p class="small">ONOFF 공식 유튜브 영상 등록 후 재생할 수 있습니다.</p>'}</div>`:''}</div>`}function videoId(url){let m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:''}function openRecord(n){recordSection=n;page='record';render();window.scrollTo(0,0)}function saveSectionRecord(){let el=$('#sectionRecord');if(!el)return;state.logs[todayKey+'-'+cls+'-'+recordSection]=el.value;save();page='class';render();toast('이 기기에 기록을 저장했습니다.')}function saveVideoUrl(id){let el=document.getElementById('video-'+id);if(!el)return;state.videoUrls=state.videoUrls||{};state.videoUrls[id]=el.value.trim();save();render();toast('동작 영상 주소를 저장했습니다.')}function saveClassText(){state.classText=state.classText||{};for(let n of [1,2])state.classText[cls+'-'+n]=document.getElementById('class-text-'+n).value;save();render();toast('수업 예시를 이 기기에 저장했습니다.')}function classes(){const w=cls==='WOD',a=state.classText||{},s1=a[cls+'-1']??(w?'Back Squat\n5 × 5':'Strict Press\n5 × 5'),s2=a[cls+'-2']??(w?'AMRAP 12 MIN\n10 Dumbbell Snatch (50/35 lbs)\n10 Pull-up':'BODY TRAINING\n12 Dumbbell Press\n15 Ring Row'),lift=w?'Back Squat':'Strict Press',pr=Object.entries(state.prs).find(([k])=>k.trim().toLowerCase()===lift.toLowerCase()),moves=selectedMoves();return `<h1 class="heading">오늘의 수업</h1><p class="sub">WOD와 BT · 동작 영상 자동 연결 체험</p><div class="switch"><button class="${w?'active':''}" onclick="cls='WOD';videoOpen='';render()">WOD CLASS</button><button class="${!w?'active':''}" onclick="cls='BT';videoOpen='';render()">BT CLASS</button></div><div class="card"><div class="section-head"><h3>SECTION 1</h3><button class="mini-btn" onclick="openRecord(1)">✎ 기록 입력 ›</button></div><div class="section">${esc(s1)}</div><p class="small">운동 관리에 저장된 ${lift} 1RM: <b>${pr?esc(pr[1])+' lbs':'미등록'}</b></p>${pr&&Number(pr[1])>0?`<div class="stats" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">${[50,60,70,80,90].map(p=>`<div class="stat" style="padding:9px 2px"><span class="small">${p}%</span><strong style="font-size:13px">${+(Number(pr[1])*p/100).toFixed(1)}</strong><span class="small">lbs</span></div>`).join('')}</div>`:'<button class="btn alt" onclick="showPage(\'manage\')">운동 관리에서 1RM 등록하기 →</button>'}</div><div class="card"><div class="section-head"><h3>SECTION 2</h3><button class="mini-btn" onclick="openRecord(2)">✎ 기록 입력 ›</button></div><div class="section">${esc(s2)}</div></div><div class="card"><h3>▣ 오늘의 동작 영상</h3><p class="small">수업 동작에 따라 자동으로 표시됩니다.</p><div class="video-list">${moves.map(videoCard).join('')||'<p class="small">매칭된 운동 동작이 없습니다.</p>'}</div></div><button class="btn alt" onclick="adminVideo=!adminVideo;render()">${adminVideo?'관리자 체험 닫기':'관리자 수업 · 영상 연결 체험'}</button>${adminVideo?`<div class="card"><h3>관리자 · ${cls} 수업 편집 (체험)</h3><p class="small">동작 이름을 포함하면 영상 목록에 자동 표시됩니다.</p><label class="small">SECTION 1</label><textarea id="class-text-1">${esc(s1)}</textarea><label class="small">SECTION 2</label><textarea id="class-text-2">${esc(s2)}</textarea><button class="btn" onclick="saveClassText()">수업 저장 · 자동 매칭</button><h3 style="margin-top:22px">동작별 유튜브 영상 주소</h3>${library().map(x=>`<div class="score" style="margin:8px 0"><label>${esc(x.name)}</label><input id="video-${x.id}" placeholder="https://youtu.be/..." value="${esc(x.url)}"><button class="btn alt" style="margin-top:7px" onclick="saveVideoUrl('${x.id}')">주소 저장</button></div>`).join('')}</div>`:''}<p class="preview-warning">디자인 체험판: 수업과 영상 주소는 이 기기에만 저장됩니다. 실제 회원·관리자 서버 연동 전입니다.</p>`}function recordPage(){let value=state.logs[todayKey+'-'+cls+'-'+recordSection]||'';return `<h1 class="heading">SECTION ${recordSection} · 기록 입력</h1><p class="sub">${cls} CLASS · 모든 중량은 lbs</p><div class="card"><h3>나의 기록</h3><textarea id="sectionRecord" placeholder="${recordSection===1?'예: 185 lbs × 5회 × 5세트':'예: 5 Rounds + 8 Reps · RX'}">${esc(value)}</textarea><button class="btn" style="margin-top:12px" onclick="saveSectionRecord()">기록 저장</button><button class="btn alt" style="margin-top:9px" onclick="showPage('class')">오늘의 수업으로 돌아가기</button></div>`}function saveLog(){state.logs[todayKey+'-'+cls+'-1']=$('#s1').value;state.logs[todayKey+'-'+cls+'-2']=$('#s2').value;save();toast('이 기기에 운동 기록을 저장했습니다.')}function manage(){let entries=Object.entries(state.logs).filter(([k,v])=>v.trim());return `<h1 class="heading">운동 관리</h1><p class="sub">나의 운동 기록과 PR을 확인하세요.</p><div class="card"><h3>운동 기록</h3>${entries.length?entries.sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<div class="score" style="margin:8px 0"><div class="small">${esc(k)}</div><div>${esc(v)}</div></div>`).join(''):'<p class="info">아직 작성된 기록이 없습니다. 오늘 수업에서 기록을 남겨보세요.</p>'}</div><div class="card"><h3>나의 PR (lbs)</h3><div class="stack"><input id="prName" placeholder="종목 예: Back Squat"><input id="prValue" type="number" placeholder="중량 (lbs)"><button class="btn alt" onclick="savePr()">PR 등록</button></div>${Object.entries(state.prs).map(([n,v])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #354649"><b>${esc(n)}</b><span>${esc(v)} lbs</span></div>`).join('')}</div>`}function savePr(){let n=$('#prName').value.trim(),v=$('#prValue').value;if(!n||!v)return toast('종목과 중량을 입력해 주세요');state.prs[n]=Number(v);save();render();toast('PR이 저장되었습니다.')}function share(){return `<h1 class="heading">기록 공유</h1><p class="sub">회원 이름 옆에 ONOFF 활동 연차 메달을 표시합니다.</p><div class="card"><div class="row"><span class="avatar">${avatar()}</span><div style="flex:1"><b>${esc(state.name)}</b><br><span class="badge">🏅 ${rank()}</span></div><span class="small">나의 프로필</span></div></div><div class="card"><h3>회원 기록 예시</h3>${[['김OO','3 YEARS','Back Squat · 225 lb'],['이OO','2 YEARS','Fran · 6:40'],['박OO','1 YEAR','첫 Pull-up 달성']].map(([n,r,t])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #34464a"><div><b>${n}</b> <span class="badge">🏅 ${r}</span><div class="small" style="margin-top:5px">${t}</div></div><span style="color:var(--mint)">›</span></div>`).join('')}<p class="small">다른 회원 기록은 가상 데이터입니다. 실제 공유는 Firebase 연동 이후 가능합니다.</p></div>`}function profile(){return `<h1 class="heading">MY 프로필</h1><p class="sub">가입 및 캐릭터 설정 체험</p><div class="card" style="text-align:center"><div style="font-size:72px">${avatar()}</div><h2>${esc(state.name)}</h2><span class="badge">🏅 ONOFF ${rank()}</span></div><div class="card"><h3>기본 정보</h3><div class="stack"><label class="small">이름</label><input id="memberName" value="${esc(state.name)}"><label class="small">캐릭터 선택</label><div class="choice"><button class="${state.gender==='male'?'selected':''}" onclick="setGender('male')">🏋🏻‍♂️ 남성</button><button class="${state.gender==='female'?'selected':''}" onclick="setGender('female')">🏋🏻‍♀️ 여성</button></div><label class="small">이지스포 최초 등록일 (카운터 인증 후 관리자가 입력하는 항목 · 시연)</label><input id="firstDate" type="date" value="${esc(state.firstDate)}"><label class="small">주간 출석 목표</label><select id="goal"><option value="2" ${state.goal==2?'selected':''}>주 2회</option><option value="3" ${state.goal==3?'selected':''}>주 3회</option><option value="4" ${state.goal==4?'selected':''}>주 4회</option><option value="5" ${state.goal==5?'selected':''}>주 5회</option></select><button class="btn" onclick="saveProfile()">프로필 저장</button></div></div><div class="card"><h3>체험판 안내</h3><p class="info">실제 회원가입, 관리자 승인, 이지스포 조회, GPS 검증, 회원 데이터 동기화는 구현되지 않았습니다. 이 기기의 브라우저에만 체험 데이터가 저장됩니다.</p><button class="btn outline" onclick="resetDemo()">체험 데이터 초기화</button></div>`}function setGender(g){state.gender=g;save();render()}function saveProfile(){state.name=$('#memberName').value.trim()||'ONOFF 회원';state.firstDate=$('#firstDate').value||'2023-03-15';state.goal=Number($('#goal').value);save();render();toast('프로필 체험 설정을 저장했습니다.')}function resetDemo(){if(confirm('체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(K);location.reload()}}render();
</script></body></html>
