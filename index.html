<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ONOFF CrossFit · 디자인 체험</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#101719;--panel:#1d292d;--panel2:#243338;--mint:#6ce3bc;--white:#f2f1e9;--muted:#a6b9b9}*{box-sizing:border-box}body{margin:0;background:#090f11;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;background:var(--bg);padding:env(safe-area-inset-top) 18px calc(100px + env(safe-area-inset-bottom));position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 0 10px}.brand{width:155px;height:62px;object-fit:contain;object-position:left center}.iconbtn{border:0;background:#25353a;color:white;border-radius:14px;padding:11px}.hello{font-size:25px;font-weight:800;margin:5px 0 18px}.muted{color:var(--muted)}.eyebrow{font-size:11px;color:var(--mint);font-weight:800;letter-spacing:1px}.card{background:var(--panel);border:1px solid #2b4145;border-radius:19px;padding:17px;margin:12px 0}.card h3{margin:0 0 12px;font-size:18px}.small{font-size:12px;color:var(--muted)}.refcard{width:100%;border-radius:15px;display:block;border:1px solid var(--mint)}.refwrap{position:relative;cursor:pointer;margin-bottom:14px}.reftip{position:absolute;bottom:7px;right:9px;background:#102521c9;padding:4px 7px;border-radius:6px;font-size:10px;color:#d3f8eb}.btn{background:var(--mint);border:0;border-radius:13px;color:#0d2822;font-weight:800;padding:14px 17px;width:100%}.btn.alt{background:#30474a;color:#e5f7f0}.btn.outline{background:transparent;color:var(--mint);border:1px solid #4c9e86}.btn:disabled{opacity:.45}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.pill{display:inline-block;padding:5px 9px;border-radius:100px;background:#38554c;color:#b8f4da;font-size:11px}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:#142024f5;border-top:1px solid #304144;padding:10px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.tab{flex:1;border:0;background:transparent;color:#9aafae;font-size:10px;display:grid;gap:4px;place-items:center}.tab .emoji{font-size:22px}.tab.active{color:var(--mint)}.heading{font-size:25px;margin:12px 0 5px}.sub{font-size:13px;color:var(--muted);margin:0 0 17px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.arrow{background:#2a4142;border:0;color:var(--mint);border-radius:9px;padding:7px 13px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{text-align:center;font-size:11px;color:#b4c4c3;padding:7px 0}.day{aspect-ratio:1;position:relative;border-radius:13px;border:1px solid #3a4a4d;background:#29373b;color:#dbe7e2;display:flex;align-items:center;justify-content:center;font-size:13px}.day.done{background:linear-gradient(140deg,#337b63,#1f5146);border-color:#6ce3bc}.day.appcheck{background:#304b6c;border-color:#719fda}.day.today{outline:2px solid var(--mint);outline-offset:2px}.day.empty{background:transparent;border:0}.day .dot{position:absolute;bottom:2px;font-size:8px}.day.sunday{color:#f0b7a8}.avatar{font-size:32px;filter:drop-shadow(0 5px 3px #0006)}.choice{display:flex;gap:9px}.choice button{flex:1;padding:13px;background:#26373a;border:1px solid #435454;color:white;border-radius:12px}.choice button.selected{border:2px solid var(--mint);background:#285143}.score{background:#132123;border:1px solid #314648;border-radius:12px;padding:12px}.score label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}textarea,input{width:100%;background:#101b1f;border:1px solid #3a5051;border-radius:11px;padding:12px;color:white;outline:none}textarea{resize:vertical;min-height:75px}.section{padding:13px;background:#132125;border-radius:12px;white-space:pre-wrap;line-height:1.6;font-size:14px}.notice{background:#23353a;border-radius:12px;padding:14px}.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:110px;background:#d9f7eb;color:#16372c;padding:12px 18px;border-radius:12px;box-shadow:0 6px 30px #0009;font-weight:700;max-width:90%;text-align:center}.hidden{display:none!important}.switch{display:flex;gap:8px;margin:12px 0}.switch button{flex:1;padding:11px;border-radius:12px;background:#2b3d42;color:#c3d2d0;border:0}.switch button.active{background:#3e7562;color:#fff}.badge{border-radius:100px;background:#4d432e;color:#f3d38b;font-size:12px;padding:5px 10px}.progress{height:8px;background:#3a5150;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--mint);border-radius:9px}.footer-note{font-size:11px;color:#8fa6a4;text-align:center;padding:15px 0}.road{padding:18px 9px;background:radial-gradient(ellipse at 30% 20%,#315f4b,#152b2b 65%,#172225);border-radius:18px}.roadgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.roadstep{height:41px;display:grid;place-items:center;border-radius:50%;background:#354c4a;color:#b5c7c1;border:2px solid #59736c;font-size:12px;font-weight:700}.roadstep.done{background:#357c61;color:white;border-color:#79edbf}.roadstep.appcheck{background:#3b5b8b;border-color:#91b8ed}.roadstep.today{box-shadow:0 0 0 3px #e8d08b}.roadstep.empty{visibility:hidden}.roadstep .avatar{font-size:23px}.tag{font-size:10px;background:#34484b;border-radius:6px;padding:4px 7px}.inline{display:inline-flex;align-items:center;gap:5px}.info{line-height:1.6;font-size:13px;color:#b2c5c1}details summary{cursor:pointer;font-weight:700}details{margin:10px 0} .ref-note{font-size:11px;color:#91aaa3;margin-top:5px}
</style></head><body><div class="app"><header class="top"><img class="brand" src="logo-source.png" alt="ONOFF 로고"><button class="iconbtn" onclick="showPage('profile')">👤</button></header><main id="content"></main><nav class="tabbar" id="nav"></nav></div><div class="toast hidden" id="toast"></div><script>
const today=new Date(), K='onoff-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(K))||{}}catch{state={}};state={name:'ONOFF 회원',gender:'male',firstDate:'2023-03-15',goal:3,visits:{},logs:{},prs:{},...state};let page='home',month=new Date(today.getFullYear(),today.getMonth(),1),cls='WOD',selectedDay=null;const $=s=>document.querySelector(s);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,todayKey=fmt(today);function save(){localStorage.setItem(K,JSON.stringify(state))}function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isHoliday(d){const k=fmt(d);const fixed=['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];return fixed.includes(k.slice(5))}function isAppDay(d){return d.getDay()===0||isHoliday(d)}function visits(){return Object.values(state.visits).filter(Boolean)}function count(type){return Object.values(state.visits).filter(v=>v===type).length}function avatar(){return state.gender==='female'?'🏋🏻‍♀️':'🏋🏻‍♂️'}function rank(){const yrs=Math.max(0,today.getFullYear()-new Date(state.firstDate+'T12:00:00').getFullYear()-(today.getMonth()<new Date(state.firstDate+'T12:00:00').getMonth()||today.getMonth()===new Date(state.firstDate+'T12:00:00').getMonth()&&today.getDate()<new Date(state.firstDate+'T12:00:00').getDate()?1:0));return yrs+' YEARS'}function render(){let tabs=[['home','⌂','홈'],['class','🏋️','오늘 수업'],['manage','▥','운동 관리'],['share','♧','기록 공유']];$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="tab ${page===p?'active':''}" onclick="showPage('${p}')"><span class="emoji">${i}</span>${t}</button>`).join('');let out=page==='home'?home():page==='road'?road():page==='checkin'?checkin():page==='class'?classes():page==='manage'?manage():page==='share'?share():profile();$('#content').innerHTML=out}function showPage(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function home(){const n=visits().length;return `<div class="eyebrow">CHALLENGE STARTS TODAY</div><div class="hello">안녕하세요<br>${esc(state.name)}님 👋</div><div class="refwrap" onclick="showPage('road')"><img class="refcard" src="card-reference.jpg" alt="나의 출석 챌린지 원본 디자인 시안"><div class="reftip">디자인 원본 · 눌러서 로드맵 보기 ›</div></div><div class="card"><div class="row"><b>나의 실제 체험 현황</b><span class="badge">🏅 ${rank()}</span></div><div class="row" style="margin-top:12px"><div><div class="small">GPS 방문 출석</div><h2 style="margin:4px 0">${count('gym')}회</h2></div><div><div class="small">앱 체크인</div><h2 style="margin:4px 0">${count('app')}회</h2></div><div><div class="small">로드맵 달성</div><h2 style="margin:4px 0">${n}일</h2></div></div><button class="btn" onclick="showPage('checkin')">오늘 출석 체험하기 →</button></div><div class="card"><div class="row"><h3>오늘의 운동</h3><span class="small">WOD / BT</span></div><div class="section">WOD · Section 1<br>Back Squat 5 × 5<br><br>Section 2<br>For Time · 80 Toes to Bar / 30 Thrusters</div><button class="btn alt" style="margin-top:12px" onclick="showPage('class')">오늘 수업 보기</button></div><div class="card"><h3>📢 공지사항</h3><div class="notice">ONOFF 앱 디자인 체험 버전입니다.<br><span class="small">표시된 수업과 공지는 예시입니다.</span></div></div>`}function calendarCells(roadMode=false){let first=month.getDay(),last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),a=[];for(let i=0;i<first;i++)a.push(`<div class="${roadMode?'roadstep':'day'} empty"></div>`);for(let i=1;i<=last;i++){let d=new Date(month.getFullYear(),month.getMonth(),i),k=fmt(d),type=state.visits[k],same=k===todayKey,cl=`${roadMode?'roadstep':'day'} ${type==='gym'?'done':type==='app'?'appcheck':''} ${same?'today':''} ${d.getDay()===0?'sunday':''}`;a.push(`<button class="${cl}" onclick="dayDetail('${k}')" aria-label="${k} 출석 ${type?'완료':'미기록'}">${roadMode&&same?`<span class="avatar">${avatar()}</span>`:i}${type&&!roadMode?'<span class="dot">✓</span>':''}</button>`)}return a.join('')}function road(){let ym=`${month.getFullYear()}년 ${month.getMonth()+1}월`,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),done=Object.keys(state.visits).filter(k=>k.startsWith(fmt(month).slice(0,7))).length;return `<h1 class="heading">월간 출석 로드맵</h1><p class="sub">하루 한 칸씩, 나의 운동 습관을 기록합니다.</p><div class="card"><div class="row"><span class="badge">🏅 ${rank()}</span><span class="pill">${avatar()} ${esc(state.name)}</span></div><h2>${done} <span class="small">/ ${days}일</span></h2><div class="progress"><span style="width:${done/days*100}%"></span></div><p class="small">GPS 출석 ${Object.entries(state.visits).filter(([k,v])=>k.startsWith(fmt(month).slice(0,7))&&v==='gym').length}일 · 앱 체크인 ${Object.entries(state.visits).filter(([k,v])=>k.startsWith(fmt(month).slice(0,7))&&v==='app').length}일</p></div><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${ym}</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="road"><div class="days" style="margin-bottom:9px">${['일','월','화','수','목','금','토'].map(t=>`<div class="weekday">${t}</div>`).join('')}</div><div class="roadgrid">${calendarCells(true)}</div></div><div class="card"><div class="row"><span class="inline"><span style="color:var(--mint)">●</span><span class="small">GPS 출석</span></span><span class="inline"><span style="color:#82b5ff">●</span><span class="small">앱 체크인</span></span><span class="inline"><span style="color:#d3bd76">◉</span><span class="small">오늘</span></span></div><p class="info">일요일과 고정 공휴일은 앱 체크인, 나머지 날은 GPS 출석을 체험합니다. 음력·대체·임시 공휴일 자동 판정은 실제 개발 시 공식 달력 연동이 필요합니다.</p><button class="btn" onclick="showPage('checkin')">오늘 출석하러 가기</button></div>`}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function dayDetail(k){selectedDay=k;const d=new Date(k+'T12:00:00'),t=state.visits[k];toast(`${k} · ${t==='gym'?'GPS 방문 출석':t==='app'?'앱 체크인':'출석 기록 없음'}`)}function checkin(){const app=isAppDay(today),v=state.visits[todayKey];return `<h1 class="heading">오늘의 출석</h1><p class="sub">${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 · ${['일','월','화','수','목','금','토'][today.getDay()]}요일</p><div class="card" style="text-align:center;padding:25px 18px"><div style="font-size:58px;margin:15px">${app?'☕':'📍'}</div><h2>${app?'오늘도 ONOFF!':'GPS 출석 체크'}</h2><p class="info">${app?'일요일·공휴일에는 앱에서 버튼을 눌러 로드맵을 채웁니다.':'평일·토요일에는 체육관에 방문하여 GPS로 출석합니다.'}</p><div class="score" style="margin:17px 0"><span class="pill">${v?'✓ 오늘 체크 완료':app?'앱 체크인 가능':'GPS 방문 출석'}</span></div><button class="btn" ${v?'disabled':''} onclick="checkToday()">${v?'오늘 출석 완료':app?'오늘도 ONOFF · 체크인':'GPS 출석 시뮬레이션'}</button><p class="small">${app?'앱 체크인은 실제 운동 방문으로 계산하지 않습니다.':'이 체험판에서는 GPS를 확인하지 않습니다. 버튼으로 가상 출석만 저장됩니다.'}</p></div><div class="card"><h3>이번 달 출석 현황</h3><button class="btn alt" onclick="month=new Date(today.getFullYear(),today.getMonth(),1);showPage('road')">로드맵 확인 →</button></div>`}function checkToday(){if(state.visits[todayKey])return;state.visits[todayKey]=isAppDay(today)?'app':'gym';save();render();toast('체험 출석이 기록되었습니다!')}function classes(){const w=cls==='WOD';return `<h1 class="heading">오늘 수업</h1><p class="sub">WOD와 BT는 별도로 기록할 수 있습니다.</p><div class="switch"><button class="${w?'active':''}" onclick="cls='WOD';render()">WOD Class</button><button class="${!w?'active':''}" onclick="cls='BT';render()">BT Class</button></div><div class="card"><div class="eyebrow">${cls} CLASS · SAMPLE</div><h3 style="margin-top:9px">SECTION 1</h3><div class="section">${w?'Back Squat\n5 × 5\n1RM 기준 50% ~ 90%':'Body Training\nStrength & Accessory\n3 Rounds · Coach guidance'}</div><h3 style="margin-top:20px">SECTION 2</h3><div class="section">${w?'For Time\n80 Toes to Bar\n30 Thrusters (95/65 lb)':'Body Training\nCore / Conditioning\n12 min AMRAP'}</div><p class="small">운동 내용은 체험용 예시이며 실제 수업 편성은 아닙니다.</p></div><div class="card"><h3>나의 운동 기록</h3><div class="stack"><div class="score"><label>SECTION 1 기록 (선택)</label><textarea id="s1" placeholder="예: 135 lb × 5회">${esc(state.logs[todayKey+'-'+cls+'-1']||'')}</textarea></div><div class="score"><label>SECTION 2 기록 (선택)</label><textarea id="s2" placeholder="예: 12:35 RX / Scaled">${esc(state.logs[todayKey+'-'+cls+'-2']||'')}</textarea></div><button class="btn" onclick="saveLog()">기록 저장하기</button></div></div>`}function saveLog(){state.logs[todayKey+'-'+cls+'-1']=$('#s1').value;state.logs[todayKey+'-'+cls+'-2']=$('#s2').value;save();toast('이 기기에 운동 기록을 저장했습니다.')}function manage(){let entries=Object.entries(state.logs).filter(([k,v])=>v.trim());return `<h1 class="heading">운동 관리</h1><p class="sub">나의 운동 기록과 PR을 확인하세요.</p><div class="card"><h3>운동 기록</h3>${entries.length?entries.sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<div class="score" style="margin:8px 0"><div class="small">${esc(k)}</div><div>${esc(v)}</div></div>`).join(''):'<p class="info">아직 작성된 기록이 없습니다. 오늘 수업에서 기록을 남겨보세요.</p>'}</div><div class="card"><h3>나의 PR (lb)</h3><div class="stack"><input id="prName" placeholder="종목 예: Back Squat"><input id="prValue" type="number" placeholder="중량 (lb)"><button class="btn alt" onclick="savePr()">PR 등록</button></div>${Object.entries(state.prs).map(([n,v])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #354649"><b>${esc(n)}</b><span>${esc(v)} lb</span></div>`).join('')}</div>`}function savePr(){let n=$('#prName').value.trim(),v=$('#prValue').value;if(!n||!v)return toast('종목과 중량을 입력해 주세요');state.prs[n]=Number(v);save();render();toast('PR이 저장되었습니다.')}function share(){return `<h1 class="heading">기록 공유</h1><p class="sub">회원 이름 옆에 ONOFF 활동 연차 메달을 표시합니다.</p><div class="card"><div class="row"><span class="avatar">${avatar()}</span><div style="flex:1"><b>${esc(state.name)}</b><br><span class="badge">🏅 ${rank()}</span></div><span class="small">나의 프로필</span></div></div><div class="card"><h3>회원 기록 예시</h3>${[['김OO','3 YEARS','Back Squat · 225 lb'],['이OO','2 YEARS','Fran · 6:40'],['박OO','1 YEAR','첫 Pull-up 달성']].map(([n,r,t])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #34464a"><div><b>${n}</b> <span class="badge">🏅 ${r}</span><div class="small" style="margin-top:5px">${t}</div></div><span style="color:var(--mint)">›</span></div>`).join('')}<p class="small">다른 회원 기록은 가상 데이터입니다. 실제 공유는 Firebase 연동 이후 가능합니다.</p></div>`}function profile(){return `<h1 class="heading">MY 프로필</h1><p class="sub">가입 및 캐릭터 설정 체험</p><div class="card" style="text-align:center"><div style="font-size:72px">${avatar()}</div><h2>${esc(state.name)}</h2><span class="badge">🏅 ONOFF ${rank()}</span></div><div class="card"><h3>기본 정보</h3><div class="stack"><label class="small">이름</label><input id="memberName" value="${esc(state.name)}"><label class="small">캐릭터 선택</label><div class="choice"><button class="${state.gender==='male'?'selected':''}" onclick="setGender('male')">🏋🏻‍♂️ 남성</button><button class="${state.gender==='female'?'selected':''}" onclick="setGender('female')">🏋🏻‍♀️ 여성</button></div><label class="small">이지스포 최초 등록일 (카운터 인증 후 관리자가 입력하는 항목 · 시연)</label><input id="firstDate" type="date" value="${esc(state.firstDate)}"><label class="small">주간 출석 목표</label><select id="goal"><option value="2" ${state.goal==2?'selected':''}>주 2회</option><option value="3" ${state.goal==3?'selected':''}>주 3회</option><option value="4" ${state.goal==4?'selected':''}>주 4회</option><option value="5" ${state.goal==5?'selected':''}>주 5회</option></select><button class="btn" onclick="saveProfile()">프로필 저장</button></div></div><div class="card"><h3>체험판 안내</h3><p class="info">실제 회원가입, 관리자 승인, 이지스포 조회, GPS 검증, 회원 데이터 동기화는 구현되지 않았습니다. 이 기기의 브라우저에만 체험 데이터가 저장됩니다.</p><button class="btn outline" onclick="resetDemo()">체험 데이터 초기화</button></div>`}function setGender(g){state.gender=g;save();render()}function saveProfile(){state.name=$('#memberName').value.trim()||'ONOFF 회원';state.firstDate=$('#firstDate').value||'2023-03-15';state.goal=Number($('#goal').value);save();render();toast('프로필 체험 설정을 저장했습니다.')}function resetDemo(){if(confirm('체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(K);location.reload()}}render();
</script></body></html>
