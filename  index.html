'use strict';const K='onoff-demo-v1',today=new Date(),pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,todayKey=fmt(today),$=s=>document.querySelector(s);let state={};try{state=JSON.parse(localStorage.getItem(K))||{}}catch(e){}state={name:'ONOFF 회원',gender:'male',firstDate:'2023-03-15',goal:3,visits:{},logs:{},prs:{},...state};for(const k of ['visits','logs','prs','publishedClasses','classDrafts'])state[k]=state[k]||{};let page='home',cls='WOD',month=new Date(today.getFullYear(),today.getMonth(),1),adminDate=todayKey,adminClass='WOD',adminMode=false;function save(){localStorage.setItem(K,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>el.style.display='none',2600)}function isAppDay(d){return d.getDay()===0||['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'].includes(fmt(d).slice(5))}function avatar(){return state.gender==='female'?'🏋🏻‍♀️':'🏋🏻‍♂️'}function rank(){const f=new Date(state.firstDate+'T12:00:00');let y=today.getFullYear()-f.getFullYear();if(today.getMonth()<f.getMonth()||(today.getMonth()===f.getMonth()&&today.getDate()<f.getDate()))y--;return Math.max(0,y)+' YEARS'}function render(){const tabs=adminMode?[['admin','⚙️','관리자'],['home','⌂','회원 화면']]:[['home','⌂','홈'],['class','🏋️','오늘 수업'],['manage','▥','운동 관리'],['share','♧','기록 공유']];$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="tab ${page===p?'active':''}" onclick="showPage('${p}')"><span class="emoji">${i}</span>${t}</button>`).join('');$('#content').innerHTML=({home,checkin,road,classes,manage,share,profile,recordPage,adminPage}[page]||home)()}function showPage(p){if(p==='home'&&adminMode)adminMode=false;page=p;render();window.scrollTo(0,0)}function home(){const key=fmt(month).slice(0,7),m=Object.entries(state.visits).filter(([k])=>k.startsWith(key)),gym=m.filter(([,v])=>v==='gym').length,app=m.filter(([,v])=>v==='app').length,goal=Number(state.goal||3)*4,done=gym+app;return `<div class="card"><h3>📢 공지사항</h3><div class="notice">${state.noticePublished?esc(state.noticePublished):'ONOFF 공지사항\n관리자가 등록한 공지가 이곳에 표시됩니다.'}</div></div><div class="card"><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${month.getFullYear()}년 ${month.getMonth()+1}월</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="days">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${calendarCells()}</div><p class="small">🔥 방문 출석　😊 앱 참여</p><button class="btn alt" onclick="showPage('checkin')">오늘 출석 체험하기</button></div><div class="card"><h3>나의 출석 현황</h3><div class="stats"><div class="stat"><span class="small">방문 출석</span><strong style="color:#ff936b">${gym}회</strong></div><div class="stat"><span class="small">앱 참여</span><strong style="color:#ffd45e">${app}회</strong></div><div class="stat"><span class="small">월간 달성</span><strong>${done}일</strong></div></div><div class="progress" style="margin:15px 0"><span style="width:${Math.min(100,done/Math.max(1,goal)*100)}%"></span></div><p class="small">월간 목표 ${done} / ${goal}일</p><button class="btn alt" onclick="showPage('road')">월간 출석 로드맵 →</button></div>`}function calendarCells(){const first=new Date(month.getFullYear(),month.getMonth(),1).getDay(),last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let a=[];for(let i=0;i<first;i++)a.push('<div class="day empty"></div>');for(let i=1;i<=last;i++){const d=new Date(month.getFullYear(),month.getMonth(),i),k=fmt(d),v=state.visits[k];a.push(`<button class="day ${k===todayKey?'today':''} ${d.getDay()===0?'sunday':''}" onclick="dayDetail('${k}')">${i}${v?`<span class="calendar-icon">${v==='gym'?'🔥':'😊'}</span>`:''}</button>`)}return a.join('')}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function dayDetail(k){toast(`${k} · ${state.visits[k]==='gym'?'방문 출석':state.visits[k]==='app'?'앱 참여':'출석 기록 없음'}`)}function road(){return `<h1 class="heading">월간 출석 로드맵</h1><p class="sub">하루 한 칸씩 운동 습관을 기록합니다.</p><div class="card"><span class="badge">🏅 ${rank()}</span><div class="calendar-head"><button class="arrow" onclick="shiftMonth(-1)">‹</button><b>${month.getFullYear()}년 ${month.getMonth()+1}월</b><button class="arrow" onclick="shiftMonth(1)">›</button></div><div class="days">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${calendarCells()}</div></div><button class="btn" onclick="showPage('checkin')">오늘 출석하러 가기</button>`}function checkin(){const app=isAppDay(today),v=state.visits[todayKey];return `<h1 class="heading">오늘의 출석</h1><p class="sub">${todayKey}</p><div class="card" style="text-align:center;padding:25px 18px"><div style="font-size:58px;margin:15px">${app?'😊':'📍'}</div><h2>${app?'앱 참여 체크인':'GPS 출석 체크'}</h2><p class="info">${app?'일요일·고정 공휴일 앱 참여 체험입니다.':'방문 출석 시뮬레이션입니다. 실제 GPS를 확인하지 않습니다.'}</p><button class="btn" ${v?'disabled':''} onclick="checkToday()">${v?'오늘 출석 완료':'오늘 출석 체험하기'}</button></div>`}function checkToday(){if(state.visits[todayKey])return;state.visits[todayKey]=isAppDay(today)?'app':'gym';save();render();toast('이 기기에 체험 출석이 저장되었습니다.')}
const demoClasses={WOD:{s1:'Back Squat                         185 lbs\n5reps × 5set',s2:'AMRAP 12 MIN\n5 Pull-ups\n10 Dumbbell Snatches (35/20 lbs)\n15 Air Squats'},BT:{s1:'Strict Press\n5reps × 5set',s2:'BODY TRAINING\n12 Dumbbell Press\n15 Ring Row'}};const exerciseLibrary=[{name:'Back Squat',aliases:['back squat','백 스쿼트'],url:''},{name:'Pull-up',aliases:['pull-ups','pull-up','pull up','풀업'],url:''},{name:'Dumbbell Snatch',aliases:['dumbbell snatches','dumbbell snatch','db snatch','덤벨 스내치'],url:''},{name:'Air Squat',aliases:['air squats','air squat'],url:''},{name:'Strict Press',aliases:['strict press'],url:''},{name:'Dumbbell Press',aliases:['dumbbell press'],url:''},{name:'Ring Row',aliases:['ring rows','ring row'],url:''},{name:'Toes to Bar',aliases:['toes to bar','ttb'],url:''},{name:'Thruster',aliases:['thrusters','thruster'],url:''},{name:'Wall Ball',aliases:['wall balls','wall ball'],url:''}];function getClass(c){return state.publishedClasses[todayKey+'-'+c]||demoClasses[c]}function videos(t){const lower=String(t||'').toLowerCase(),matches=exerciseLibrary.filter(x=>x.aliases.some(a=>lower.includes(a))),ready=matches.filter(x=>/^https:\/\/(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)/.test(x.url));return `<div class="video-heading">Demo Videos</div>${ready.length?`<div class="video-links">${ready.map(x=>`<a class="video-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">▶ ${esc(x.name)}</a>`).join('')}</div>`:'<div class="video-unavailable">공식 영상 링크 확인 후 표시됩니다.</div>'}`}function percentages(c){const lift=c==='WOD'?'Back Squat':'Strict Press',pr=Object.entries(state.prs).find(([k])=>k.trim().toLowerCase()===lift.toLowerCase());return pr&&Number(pr[1])>0?`<div class="percent-row">${[50,60,70,80,90].map(p=>`<div class="percent">${p}%<b>${+(Number(pr[1])*p/100).toFixed(1)} lb</b></div>`).join('')}</div>`:''}function classes(){const w=cls==='WOD',d=getClass(cls);return `<h1 class="heading">오늘의 수업</h1><p class="sub">WOD / BT CLASS</p><div class="switch"><button class="wod ${w?'active':''}" onclick="cls='WOD';render()">WOD CLASS</button><button class="bt ${!w?'active':''}" onclick="cls='BT';render()">BT CLASS</button></div><div class="card class-card"><div class="section-title" style="color:${w?'var(--wod)':'var(--bt)'}">SECTION 1</div><div class="class-body">${esc(d.s1)}</div>${percentages(cls)}${videos(d.s1)}<hr class="class-divider"><div class="section-title" style="color:${w?'var(--wod)':'var(--bt)'}">SECTION 2</div><div class="class-body">${esc(d.s2)}</div>${videos(d.s2)}<button class="btn class-record" onclick="showPage('record')">오늘의 기록 입력</button></div><p class="preview-warning">체험판: 수업은 이 브라우저의 게시 데이터 또는 예시입니다. 서버 동기화 전입니다.</p>`}function recordPage(){const v1=state.logs[todayKey+'-'+cls+'-1']||'',v2=state.logs[todayKey+'-'+cls+'-2']||'';return `<h1 class="heading">오늘의 기록 입력</h1><p class="sub">${cls} CLASS · ${todayKey}</p><div class="card"><h3>SECTION 1</h3><p class="small">중량(lbs) / 횟수 / 세트</p><textarea id="s1" placeholder="예: 185 lbs × 5회 × 5세트">${esc(v1)}</textarea><hr class="class-divider"><h3>SECTION 2</h3><p class="small">라운드 / 반복 횟수 / RX 등</p><textarea id="s2" placeholder="예: 5 Rounds + 8 Reps · RX">${esc(v2)}</textarea><button class="btn" style="margin-top:15px" onclick="saveLog()">기록 저장</button><button class="btn alt" style="margin-top:9px" onclick="showPage('class')">오늘의 수업으로 돌아가기</button></div>`}function saveLog(){state.logs[todayKey+'-'+cls+'-1']=$('#s1').value;state.logs[todayKey+'-'+cls+'-2']=$('#s2').value;save();showPage('class');toast('이 기기에 운동 기록을 저장했습니다.')}function manage(){const entries=Object.entries(state.logs).filter(([,v])=>String(v).trim()).sort((a,b)=>b[0].localeCompare(a[0]));return `<h1 class="heading">운동 관리</h1><p class="sub">나의 운동 기록과 PR</p><div class="card"><h3>운동 기록</h3>${entries.length?entries.map(([k,v])=>`<div class="score" style="margin:8px 0"><div class="small">${esc(k)}</div><div style="white-space:pre-wrap">${esc(v)}</div></div>`).join(''):'<p class="info">아직 작성된 기록이 없습니다.</p>'}</div><div class="card"><h3>나의 PR (lbs)</h3><div class="stack"><input id="prName" placeholder="종목 예: Back Squat"><input id="prValue" type="number" placeholder="중량 (lbs)"><button class="btn alt" onclick="savePr()">PR 등록</button></div>${Object.entries(state.prs).map(([n,v])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #354649"><b>${esc(n)}</b><span>${esc(v)} lbs</span></div>`).join('')}</div>`}function savePr(){const n=$('#prName').value.trim(),v=$('#prValue').value;if(!n||!v)return toast('종목과 중량을 입력해 주세요');state.prs[n]=Number(v);save();render();toast('PR이 저장되었습니다.')}function share(){return `<h1 class="heading">기록 공유</h1><p class="sub">회원 기록 공유 체험</p><div class="card"><div class="row"><span style="font-size:32px">${avatar()}</span><div><b>${esc(state.name)}</b><br><span class="badge">🏅 ${rank()}</span></div></div></div><div class="card"><h3>회원 기록 예시</h3>${[['김OO','3 YEARS','Back Squat · 225 lb'],['이OO','2 YEARS','Fran · 6:40'],['박OO','1 YEAR','첫 Pull-up 달성']].map(([n,r,t])=>`<div class="score" style="margin:8px 0"><b>${n}</b> <span class="badge">🏅 ${r}</span><div class="small">${t}</div></div>`).join('')}<p class="small">가상 데이터입니다. 실제 공유는 서버 연동 이후 가능합니다.</p></div>`}function profile(){return `<h1 class="heading">MY 프로필</h1><p class="sub">프로필 설정 체험</p><div class="card" style="text-align:center"><div style="font-size:72px">${avatar()}</div><h2>${esc(state.name)}</h2><span class="badge">🏅 ONOFF ${rank()}</span></div><div class="card"><h3>기본 정보</h3><div class="stack"><label class="small">이름</label><input id="memberName" value="${esc(state.name)}"><label class="small">캐릭터 선택</label><div class="choice"><button class="${state.gender==='male'?'selected':''}" onclick="setGender('male')">🏋🏻‍♂️ 남성</button><button class="${state.gender==='female'?'selected':''}" onclick="setGender('female')">🏋🏻‍♀️ 여성</button></div><label class="small">최초 등록일</label><input id="firstDate" type="date" value="${esc(state.firstDate)}"><label class="small">주간 출석 목표</label><select id="goal">${[2,3,4,5].map(n=>`<option value="${n}" ${state.goal==n?'selected':''}>주 ${n}회</option>`).join('')}</select><button class="btn" onclick="saveProfile()">프로필 저장</button></div></div><div class="card"><h3>관리자 디자인 체험</h3><p class="info">관리자 화면은 회원 화면과 분리됩니다. 현재는 인증 없는 디자인 체험 모드입니다.</p><button class="btn alt" onclick="enterAdmin()">관리자 화면 체험하기</button></div><div class="card"><h3>체험판 안내</h3><p class="info">실제 로그인, 회원별 서버 저장, GPS 검증, 관리자 권한, 데이터 동기화는 구현되지 않았습니다.</p><button class="btn outline" onclick="resetDemo()">체험 데이터 초기화</button></div>`}function setGender(g){state.gender=g;save();render()}function saveProfile(){state.name=$('#memberName').value.trim()||'ONOFF 회원';state.firstDate=$('#firstDate').value||'2023-03-15';state.goal=Number($('#goal').value);save();render();toast('프로필을 저장했습니다.')}function resetDemo(){if(confirm('이 브라우저의 체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(K);location.reload()}}function enterAdmin(){adminMode=true;page='admin';render();window.scrollTo(0,0)}function adminKey(){return adminDate+'-'+adminClass}function adminData(){return state.classDrafts[adminKey()]||state.publishedClasses[adminKey()]||demoClasses[adminClass]}function adminPage(){const d=adminData();return `<h1 class="heading">관리자 · 디자인 체험</h1><p class="sub">회원 화면과 분리된 수업 게시 화면</p><div class="admin-banner">⚠ 실제 로그인·권한 확인이 없는 로컬 체험판입니다. 게시해도 다른 회원에게 전송되지 않습니다.</div><div class="card admin-card"><h3>수업 작성</h3><div class="admin-grid"><label>수업 날짜</label><input id="adminDate" type="date" value="${esc(adminDate)}" onchange="changeAdminSelection()"><label>수업 구분</label><select id="adminClass" onchange="changeAdminSelection()"><option value="WOD" ${adminClass==='WOD'?'selected':''}>WOD CLASS</option><option value="BT" ${adminClass==='BT'?'selected':''}>BT CLASS</option></select><label>SECTION 1 · 자유 입력</label><textarea id="adminS1" rows="5">${esc(d.s1)}</textarea><label>SECTION 2 · 자유 입력</label><textarea id="adminS2" rows="6">${esc(d.s2)}</textarea><button class="btn alt" onclick="saveDraft()">임시 저장</button><button class="btn" onclick="publishClass()">수업 게시 (이 기기에서만)</button></div><p class="preview-warning">수업 내용을 수정해도 회원 화면의 디자인 CSS는 변경되지 않습니다.</p></div><div class="card admin-card"><h3>공지사항</h3><textarea id="adminNotice" rows="4">${esc(state.noticeDraft??state.noticePublished??'')}</textarea><button class="btn alt" style="margin-top:10px" onclick="saveNoticeDraft()">공지 임시 저장</button><button class="btn" style="margin-top:9px" onclick="publishNotice()">공지 게시 (이 기기에서만)</button></div><button class="btn outline" onclick="adminMode=false;showPage('home')">회원 화면으로 돌아가기</button>`}function changeAdminSelection(){adminDate=$('#adminDate').value||todayKey;adminClass=$('#adminClass').value;render()}function draftFromForm(){return{s1:$('#adminS1').value,s2:$('#adminS2').value}}function saveDraft(){state.classDrafts[adminKey()]=draftFromForm();save();toast('이 기기에 임시 저장했습니다.')}function publishClass(){state.publishedClasses[adminKey()]=draftFromForm();delete state.classDrafts[adminKey()];save();toast('이 기기에 게시했습니다.')}function saveNoticeDraft(){state.noticeDraft=$('#adminNotice').value;save();toast('공지 임시 저장 완료')}function publishNotice(){state.noticePublished=$('#adminNotice').value;delete state.noticeDraft;save();toast('이 기기에 공지를 게시했습니다.')}render();
</script></body></html>
