const movementCatalog=movementNames.map((name,i)=>({id:'cf-'+i,name,aliases:movementAliases[name]||[],url:''}));
const videoMap={}; // Populate ONLY with verified direct CrossFit official watch URLs.
function normMove(s){return String(s).toLowerCase().replace(/[^a-z0-9가-힣]/g,'')}
function matchMoves(text){let lines=String(text||'').split(/\n/),hits=[];for(let line of lines){let cleaned=line.replace(/^\s*(?:\d+(?:\.\d+)?\s*(?:reps?|cal|m|kg|lbs?)?\s*)/i,'').replace(/\([^)]*\)/g,'').trim();if(!cleaned)continue;let normalized=normMove(cleaned);let found=movementCatalog.filter(x=>[x.name,...x.aliases].some(alias=>{let a=normMove(alias);return a.length>=3&&normalized.includes(a)})).sort((a,b)=>b.name.length-a.name.length);if(found.length){let best=found[0];if(!hits.some(h=>h.id===best.id))hits.push(best)}}return hits}
function officialUrl(move){return videoMap[move.name]||''}
function sectionVideos(text){let moves=matchMoves(text).filter(x=>officialUrl(x));if(!moves.length)return '';return `<div class="demo-label">Demo Videos</div><div class="demo-links">${moves.map(x=>`<a class="demo-link" href="${esc(officialUrl(x))}" target="_blank" rel="noopener noreferrer">◉ <u>${esc(x.name)}</u> ↗</a>`).join('')}</div>`}
function classTexts(type,date=todayKey){let a=state.classText||{},key=date+'-'+type;return [a[key+'-1']??a[type+'-1']??(type==='WOD'?'Back Squat\n5reps × 5set\n50% / 60% / 70% / 80% / 90%':'Strict Press\n5reps × 5set'),a[key+'-2']??a[type+'-2']??(type==='WOD'?'AMRAP 12 MIN\n5 Pull-ups\n10 Dumbbell Snatches (35/20 lbs)\n15 Air Squats':'3 Rounds\n12 Dumbbell Press\n15 Ring Row')]}
function classes(){let w=cls==='WOD',[s1,s2]=classTexts(cls),lift=(matchMoves(s1)[0]||{}).name||'Back Squat',pr=Object.entries(state.prs).find(([k])=>normMove(k)===normMove(lift));return `<h1 class="heading">오늘의 수업</h1><p class="sub">${today.getMonth()+1}월 ${today.getDate()}일 · ${['일','월','화','수','목','금','토'][today.getDay()]}요일</p><div class="switch"><button class="${w?'active':''}" onclick="cls='WOD';render()">WOD CLASS</button><button class="${!w?'active':''}" onclick="cls='BT';render()">BT CLASS</button></div><div class="card class-card ${w?'wod-card':'bt-card'}"><h3 class="section-title">SECTION 1</h3><div class="section">${esc(s1)}</div><div class="rm-info">1RM 기준 중량 · 50% / 60% / 70% / 80% / 90%${pr?' · '+[50,60,70,80,90].map(p=>+(Number(pr[1])*p/100).toFixed(1)).join(' / ')+' lbs':''}</div>${sectionVideos(s1)}<hr class="section-divider"><h3 class="section-title">SECTION 2</h3><div class="section">${esc(s2)}</div>${sectionVideos(s2)}<button class="btn record-main" onclick="openRecord()">✎ 오늘의 기록 입력</button></div><p class="preview-warning">개별 공식 YouTube 주소가 검증된 동작만 Demo Videos 링크가 표시됩니다. 현재 공식 영상 주소는 등록 전입니다.</p>`}
function openRecord(){page='record';render();window.scrollTo(0,0)}
function recordPage(){let s1=state.logs[todayKey+'-'+cls+'-1']||'',s2=state.logs[todayKey+'-'+cls+'-2']||'',m=s1.match(/(\d+(?:\.\d+)?)\s*lbs?\D+(\d+)\s*reps?\D+(\d+)\s*sets?/i);return `<h1 class="heading">오늘의 기록 입력</h1><p class="sub">${cls} CLASS · SECTION 1과 2를 함께 저장</p><div class="card"><h3>SECTION 1</h3><div class="record-grid"><label>lbs<input id="r-weight" type="number" inputmode="decimal" value="${m?esc(m[1]):''}" placeholder="185"></label><label>reps<input id="r-reps" type="number" value="${m?esc(m[2]):''}" placeholder="5"></label><label>set<input id="r-sets" type="number" value="${m?esc(m[3]):''}" placeholder="5"></label></div><p class="small">기존 자유 형식 기록도 보존됩니다.</p><textarea id="r-legacy" placeholder="기존 기록 / 추가 메모">${esc(m?'':s1)}</textarea><hr class="section-divider"><h3>SECTION 2</h3><textarea id="r-section2" placeholder="예: 5 Rounds + 8 Reps · RX">${esc(s2)}</textarea><button class="btn" onclick="saveCombinedRecord()">기록 저장</button><button class="btn alt" style="margin-top:9px" onclick="showPage('class')">취소</button></div>`}
function saveCombinedRecord(){let weight=$('#r-weight').value,reps=$('#r-reps').value,sets=$('#r-sets').value,legacy=$('#r-legacy').value.trim(),s2=$('#r-section2').value.trim();let s1=[weight?weight+' lbs':'',reps?reps+'reps':'',sets?sets+'set':''].filter(Boolean).join(' × ');state.logs[todayKey+'-'+cls+'-1']=[s1,legacy].filter(Boolean).join('\n');state.logs[todayKey+'-'+cls+'-2']=s2;save();showPage('class');toast('두 SECTION 기록을 이 기기에 저장했습니다.')}
function adminScreen(){let type=adminClass,[s1,s2]=classTexts(type,adminDate);let notice=state.announcement||'';return `<h1 class="heading">관리자 화면 · 체험</h1><p class="sub">회원 화면과 별도 · 실제 로그인 및 권한 확인은 미구현</p><div class="admin-menu"><button onclick="adminPage='dashboard';render()">대시보드</button><button onclick="adminPage='class';render()">수업 관리</button><button onclick="adminPage='notice';render()">공지사항</button><button onclick="adminPage='members';render()">회원 관리</button><button onclick="adminPage='attendance';render()">출석 관리</button></div>${adminPage==='dashboard'?`<div class="card"><h3>ONOFF 관리자</h3><p class="small">수업 작성 · 공지사항 · 회원 승인 · 출석 관리</p><button class="btn" onclick="adminPage='class';render()">수업 관리 열기</button></div>`:adminPage==='class'?`<div class="card"><h3>수업 작성 · 수정</h3><label class="small">날짜</label><input type="date" id="admin-date" value="${esc(adminDate)}" onchange="adminDate=this.value;render()"><div class="switch"><button class="${type==='WOD'?'active':''}" onclick="adminClass='WOD';render()">WOD CLASS</button><button class="${type==='BT'?'active':''}" onclick="adminClass='BT';render()">BT CLASS</button></div><label class="small">SECTION 1 · 자유 입력</label><textarea id="admin-s1" rows="5">${esc(s1)}</textarea><label class="small">SECTION 2 · 자유 입력</label><textarea id="admin-s2" rows="7">${esc(s2)}</textarea><div class="admin-actions"><button class="btn alt" onclick="saveAdminClass(false)">임시 저장</button><button class="btn" onclick="saveAdminClass(true)">게시하기</button></div><p class="small">관리자 작성 방식만 변경됩니다. 회원 화면 디자인은 고정입니다.</p></div>`:adminPage==='notice'?`<div class="card"><h3>공지사항</h3><textarea id="admin-notice" rows="5">${esc(notice)}</textarea><button class="btn" onclick="state.announcement=$('#admin-notice').value;save();toast('공지사항 체험 저장 완료');render()">공지사항 저장</button></div>`:`<div class="card"><h3>${adminPage==='members'?'회원 관리':'출석 관리'}</h3><p class="info">대표 전용 기능입니다. 실제 Firebase 인증·역할 검증·회원 데이터 연동 후 사용 가능합니다. 체험판에서 실제 회원 정보를 표시하거나 수정하지 않습니다.</p></div>`}<button class="btn alt" onclick="showPage('home')">회원 화면으로 돌아가기</button><p class="preview-warning">관리자 화면은 UI 체험용입니다. 인증 없이 관리자 기능을 공개 배포하면 안 됩니다.</p>`}
let adminDate=todayKey;
function saveAdminClass(publish){let a=state.classText=state.classText||{},key=adminDate+'-'+adminClass;a[key+'-1']=$('#admin-s1').value;a[key+'-2']=$('#admin-s2').value;if(publish){a[adminClass+'-1']=a[key+'-1'];a[adminClass+'-2']=a[key+'-2']}state.adminDrafts=state.adminDrafts||{};state.adminDrafts[key]=publish?'published':'draft';save();toast(publish?'수업 체험 게시 완료 (이 기기만)':'수업 임시 저장 완료 (이 기기만)')}
function manage(){let entries=Object.entries(state.logs).filter(([k,v])=>v.trim());return `<h1 class="heading">운동 관리</h1><p class="sub">나의 운동 기록과 PR을 확인하세요.</p><div class="card"><h3>운동 기록</h3>${entries.length?entries.sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<div class="score" style="margin:8px 0"><div class="small">${esc(k)}</div><div>${esc(v)}</div></div>`).join(''):'<p class="info">아직 작성된 기록이 없습니다. 오늘 수업에서 기록을 남겨보세요.</p>'}</div><div class="card"><h3>나의 PR (lbs)</h3><div class="stack"><input id="prName" placeholder="종목 예: Back Squat"><input id="prValue" type="number" placeholder="중량 (lbs)"><button class="btn alt" onclick="savePr()">PR 등록</button></div>${Object.entries(state.prs).map(([n,v])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #354649"><b>${esc(n)}</b><span>${esc(v)} lbs</span></div>`).join('')}</div>`}function savePr(){let n=$('#prName').value.trim(),v=$('#prValue').value;if(!n||!v)return toast('종목과 중량을 입력해 주세요');state.prs[n]=Number(v);save();render();toast('PR이 저장되었습니다.')}function share(){return `<h1 class="heading">기록 공유</h1><p class="sub">회원 이름 옆에 ONOFF 활동 연차 메달을 표시합니다.</p><div class="card"><div class="row"><span class="avatar">${avatar()}</span><div style="flex:1"><b>${esc(state.name)}</b><br><span class="badge">🏅 ${rank()}</span></div><span class="small">나의 프로필</span></div></div><div class="card"><h3>회원 기록 예시</h3>${[['김OO','3 YEARS','Back Squat · 225 lb'],['이OO','2 YEARS','Fran · 6:40'],['박OO','1 YEAR','첫 Pull-up 달성']].map(([n,r,t])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #34464a"><div><b>${n}</b> <span class="badge">🏅 ${r}</span><div class="small" style="margin-top:5px">${t}</div></div><span style="color:var(--mint)">›</span></div>`).join('')}<p class="small">다른 회원 기록은 가상 데이터입니다. 실제 공유는 Firebase 연동 이후 가능합니다.</p></div>`}function profile(){return `<h1 class="heading">MY 프로필</h1><p class="sub">가입 및 캐릭터 설정 체험</p><div class="card" style="text-align:center"><div style="font-size:72px">${avatar()}</div><h2>${esc(state.name)}</h2><span class="badge">🏅 ONOFF ${rank()}</span></div><div class="card"><h3>기본 정보</h3><div class="stack"><label class="small">이름</label><input id="memberName" value="${esc(state.name)}"><label class="small">캐릭터 선택</label><div class="choice"><button class="${state.gender==='male'?'selected':''}" onclick="setGender('male')">🏋🏻‍♂️ 남성</button><button class="${state.gender==='female'?'selected':''}" onclick="setGender('female')">🏋🏻‍♀️ 여성</button></div><label class="small">이지스포 최초 등록일 (카운터 인증 후 관리자가 입력하는 항목 · 시연)</label><input id="firstDate" type="date" value="${esc(state.firstDate)}"><label class="small">주간 출석 목표</label><select id="goal"><option value="2" ${state.goal==2?'selected':''}>주 2회</option><option value="3" ${state.goal==3?'selected':''}>주 3회</option><option value="4" ${state.goal==4?'selected':''}>주 4회</option><option value="5" ${state.goal==5?'selected':''}>주 5회</option></select><button class="btn" onclick="saveProfile()">프로필 저장</button></div></div><div class="card"><h3>체험판 안내</h3><button class="btn alt" onclick="adminPage='dashboard';showPage('admin')">관리자 화면 체험 (보안 인증 전)</button><p class="info">실제 회원가입, 관리자 승인, 이지스포 조회, GPS 검증, 회원 데이터 동기화는 구현되지 않았습니다. 이 기기의 브라우저에만 체험 데이터가 저장됩니다.</p><button class="btn outline" onclick="resetDemo()">체험 데이터 초기화</button></div>`}function setGender(g){state.gender=g;save();render()}function saveProfile(){state.name=$('#memberName').value.trim()||'ONOFF 회원';state.firstDate=$('#firstDate').value||'2023-03-15';state.goal=Number($('#goal').value);save();render();toast('프로필 체험 설정을 저장했습니다.')}function resetDemo(){if(confirm('체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(K);location.reload()}}render();
</script></body></html>
